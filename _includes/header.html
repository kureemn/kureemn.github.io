<header class="site-header">
  <div class="header-shell">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Kureem, home">
      <span class="wordmark-mark" aria-hidden="true"><span></span><span></span><span></span></span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/experience/' | relative_url }}"{% if page.url == '/experience/' %} aria-current="page"{% endif %}>Experience</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <svg class="theme-icon" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M16.2 12.6A7.1 7.1 0 0 1 7.4 3.8a7.2 7.2 0 1 0 8.8 8.8Z"></path>
      </svg>
      <span data-theme-label>Dark mode</span>
    </button>
  </div>
</header>
