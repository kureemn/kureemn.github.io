---
layout: default
---
<section class="hero" aria-labelledby="home-title">
  <div class="hero-copy">
    <p class="eyebrow"><span class="status-mark" aria-hidden="true"></span>{{ page.eyebrow | escape }}</p>
    <h1 class="hero-title" id="home-title">{{ page.headline | escape }}<span class="hero-period">.</span></h1>
    <p class="hero-lede">{{ page.intro | escape }}</p>
    <div class="hero-actions">
      <a class="button" href="{{ '/experience/' | relative_url }}">Explore my experience <span aria-hidden="true">↗</span></a>
      <a class="text-link" href="{{ '/about/' | relative_url }}">A little about me <span aria-hidden="true">→</span></a>
    </div>
  </div>
    <figure class="hero-art">
      <svg class="decision-map" viewBox="0 0 660 360" role="img" aria-labelledby="decision-title decision-description" xmlns="http://www.w3.org/2000/svg">
        <title id="decision-title">From listening to a product decision</title>
        <desc id="decision-description">A clear three-step process: listen to people, understand what they need, then make a product decision.</desc>
        <defs>
          <marker id="decision-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0 0 10 5 0 10Z" class="decision-arrowhead"/>
          </marker>
        </defs>
        <path class="decision-route" d="M190 178H247" marker-end="url(#decision-arrow)"/>
        <path class="decision-route" d="M411 178H468" marker-end="url(#decision-arrow)"/>
        <g class="decision-step decision-step--listen">
          <rect x="20" y="88" width="170" height="180" rx="22"/>
          <circle class="step-number" cx="52" cy="120" r="17"/>
          <text class="step-number-text" x="52" y="125" text-anchor="middle">1</text>
          <path class="step-icon" d="M88 145c0-14 10-24 23-24s23 10 23 24v17c0 14-10 24-23 24s-23-10-23-24v-17Zm-12 13v4c0 20 15 36 35 36s35-16 35-36v-4m-35 40v17m-17 0h34"/>
          <text class="step-label" x="105" y="230" text-anchor="middle">Listen</text>
          <text class="step-label" x="105" y="252" text-anchor="middle">to people</text>
        </g>
        <g class="decision-step decision-step--understand">
          <rect x="247" y="88" width="164" height="180" rx="22"/>
          <circle class="step-number" cx="279" cy="120" r="17"/>
          <text class="step-number-text" x="279" y="125" text-anchor="middle">2</text>
          <path class="step-icon" d="M303 149c0-17 14-30 31-30s31 13 31 30c0 11-6 20-15 26v12h-32v-12c-9-6-15-15-15-26Zm16 50h30m-26 10h22"/>
          <text class="step-label" x="329" y="230" text-anchor="middle">Understand</text>
          <text class="step-label" x="329" y="252" text-anchor="middle">needs</text>
        </g>
        <g class="decision-step decision-step--decide">
          <rect x="468" y="88" width="172" height="180" rx="22"/>
          <circle class="step-number" cx="500" cy="120" r="17"/>
          <text class="step-number-text" x="500" y="125" text-anchor="middle">3</text>
          <path class="step-icon" d="M535 125h48v48h-48zM545 149l9 9 19-20"/>
          <text class="step-label" x="554" y="230" text-anchor="middle">Make a product</text>
          <text class="step-label" x="554" y="252" text-anchor="middle">decision</text>
        </g>
      </svg>
      <svg class="decision-map decision-map--mobile" viewBox="0 0 320 390" role="img" aria-labelledby="decision-mobile-title decision-mobile-description" xmlns="http://www.w3.org/2000/svg">
        <title id="decision-mobile-title">From listening to a product decision</title>
        <desc id="decision-mobile-description">A clear three-step process: listen to people, understand what they need, then make a product decision.</desc>
        <defs>
          <marker id="decision-arrow-mobile" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 10 5 0 10Z" class="decision-arrowhead"/>
          </marker>
        </defs>
        <path class="decision-route" d="M160 106v26" marker-end="url(#decision-arrow-mobile)"/>
        <path class="decision-route" d="M160 238v27" marker-end="url(#decision-arrow-mobile)"/>
        <g class="decision-step decision-step--listen">
          <rect x="18" y="12" width="284" height="94" rx="18"/>
          <circle class="step-number" cx="52" cy="59" r="18"/>
          <text class="step-number-text" x="52" y="65" text-anchor="middle">1</text>
          <text class="step-label" x="82" y="65">Listen to people</text>
        </g>
        <g class="decision-step decision-step--understand">
          <rect x="18" y="144" width="284" height="94" rx="18"/>
          <circle class="step-number" cx="52" cy="191" r="18"/>
          <text class="step-number-text" x="52" y="197" text-anchor="middle">2</text>
          <text class="step-label" x="82" y="197">Understand needs</text>
        </g>
        <g class="decision-step decision-step--decide">
          <rect x="18" y="276" width="284" height="94" rx="18"/>
          <circle class="step-number" cx="52" cy="323" r="18"/>
          <text class="step-number-text" x="52" y="329" text-anchor="middle">3</text>
          <text class="step-label" x="82" y="329">Make a product decision</text>
        </g>
      </svg>
      <figcaption class="art-caption">People’s needs inform what a team builds next.</figcaption>
    </figure>
</section>
{% include client-carousel.html %}
<div class="prose home-content">{{ content }}</div>
