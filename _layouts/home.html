---
layout: default
---
<section class="hero" aria-labelledby="home-title">
  <div class="hero-copy">
    <p class="eyebrow"><span class="status-mark" aria-hidden="true"></span>{{ page.eyebrow | escape }}</p>
    <h1 class="hero-title" id="home-title">{{ page.headline | escape }}<span class="hero-period">.</span></h1>
    <p class="hero-lede">{{ page.intro | escape }}</p>
    <div class="hero-actions">
      <a class="button" href="{{ '/experience/' | relative_url }}">Explore my experience <span aria-hidden="true">↗</span></a>
      <a class="text-link" href="{{ '/about/' | relative_url }}">A little about me <span aria-hidden="true">→</span></a>
    </div>
  </div>
  <figure class="hero-art">
    <span class="art-stamp" aria-hidden="true">PEOPLE<br>→ PRODUCT</span>

      <desc id="decision-description">Listen to people at the start. The main rising path moves through their needs to a product decision; a lower curving branch explores and compares alternatives.</desc>

      <circle cx="51" cy="354" r="15" class="node node--start"/>

      <circle cx="361" cy="116" r="31" class="node node--decision"/>
      <circle cx="212" cy="404" r="13" class="node node--small"/>
      <circle cx="365" cy="306" r="20" class="node node--small"/>
      <path d="M356 108l5 8 10 1-7 7 2 10-10-5-9 5 2-10-7-7 10-1 4-8Z" class="spark"/>

      </g>
      <g class="art-label">
        <rect x="316" y="337" width="98" height="27" rx="13"/>
